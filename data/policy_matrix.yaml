# HazeReady deterministic policy matrix
#
# This file is the deterministic backbone of the system. The language model
# composes and explains; it does not decide. Every row maps
#   (role, index, band) -> decision + actions + obligations
# and every action and obligation carries a source_doc_id and a verbatim
# source_quote drawn from that document.
#
# source_quote is resolved to a character span at index-build time by
# scripts/build_index.py and validated by scripts/validate_corpus.py. A row
# whose quote does not appear verbatim in its cited document fails the build.
# Character offsets are therefore never hand-maintained here.
#
# Decision scale (ordinal, least to most restrictive). The decision applies to
# THE OUTDOOR ACTIVITY IN QUESTION, not to the institution as a whole:
#   proceed                  - goes ahead unmodified
#   proceed_with_precautions - goes ahead with reduced intensity/duration or
#                              added protection
#   restrict                 - substantially curtailed: outdoor element
#                              minimised, moved indoors at reduced intensity,
#                              or discretionary outdoor activity postponed
#   suspend                  - the outdoor activity does not proceed
#   abstain                  - no governing published guidance exists
#
# `decision` is the governing decision for the role's default cohort.
# `cohort_variants` records where published guidance differentiates.

version: 1
generated_by: hand-authored from data/corpus/, 2026-08-08
decision_scale: [proceed, proceed_with_precautions, restrict, suspend, abstain]

# The index each role's planned activity decisions are governed by. A question
# that supplies the other index is flagged as a possible index confusion rather
# than silently answered.
role_governing_index:
  general_public: psi_24h
  school: psi_24h
  preschool: psi_24h
  eldercare: psi_24h
  worksite: psi_24h
  event: psi_24h

# The cohort whose advisory row governs by default for each role.
role_default_cohort:
  general_public: healthy
  school: vulnerable
  preschool: vulnerable
  eldercare: vulnerable
  worksite: healthy
  event: healthy

rows:

