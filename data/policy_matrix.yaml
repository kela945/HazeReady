# event / psi_24h
# ---------------------------------------------------------------------------
- role: event
  index: psi_24h
  band: good
  decision: proceed
  reason_codes: [band_good]
  actions:
    - text: "The event proceeds. No advisory constraint applies at this band."
      source_doc_id: event-participant-exertion
      source_quote: "| 0 – 100 | None from the advisory |"
  obligations:
    - text: "The organiser conducts its own risk assessment using the 24-hour PSI forecast and the prevailing health advisories."
      source_doc_id: event-organiser-risk-assessment
      source_quote: "Organisers of outdoor events are to conduct their own risk assessment, using the\n24-hour PSI forecast together with the prevailing health advisories"

- role: event
  index: psi_24h
  band: moderate
  decision: proceed
  reason_codes: [band_moderate]
  actions:
    - text: "The event proceeds. No advisory constraint applies at this band."
      source_doc_id: event-participant-exertion
      source_quote: "| 0 – 100 | None from the advisory |"
  obligations:
    - text: "The organiser conducts its own risk assessment; no agency issues a proceed or cancel instruction at a given PSI value."
      source_doc_id: event-organiser-risk-assessment
      source_quote: "**The decision sits with the organiser.** No agency issues a\n   proceed/cancel instruction at a given PSI value for general events."

- role: event
  index: psi_24h
  band: unhealthy
  decision: proceed_with_precautions
  reason_codes: [band_unhealthy]
  actions:
    - text: "Healthy participants reduce prolonged or strenuous outdoor exertion; vulnerable participants minimise it. Reduce the exertion demanded by the event rather than cancelling by default."
      source_doc_id: event-participant-exertion
      source_quote: "| 101 – 200 | Healthy participants: reduce prolonged or strenuous outdoor exertion. Vulnerable participants: minimise it |"
  obligations:
    - text: "Crew and volunteers doing physical setup are workers, and the MOM worksite guidance applies to them independently of what applies to attendees."
      source_doc_id: event-static-versus-strenuous
      source_quote: "Crew and volunteers are workers, and the MOM worksite guidance applies to them\nindependently of what applies to attendees."
    - text: "No published guidance sets a PSI threshold at which an outdoor event must be cancelled."
      source_doc_id: event-organiser-risk-assessment
      source_quote: "There is no published PSI threshold at which an outdoor event must be cancelled."
  cohort_variants:
    vulnerable:
      decision: restrict
      note: "Vulnerable participants minimise prolonged or strenuous outdoor exertion."
      source_doc_id: nea-psi-health-advisory-vulnerable
      source_quote: "Minimise prolonged or strenuous outdoor physical exertion"

- role: event
  index: psi_24h
  band: very_unhealthy
  decision: restrict
  reason_codes: [band_very_unhealthy]
  actions:
    - text: "All participants are to avoid prolonged or strenuous outdoor exertion. A competitive race or mass sports event is exactly that, and is difficult to reconcile with the advisory at this band."
      source_doc_id: event-participant-exertion
      source_quote: "At 201–300 the advisory tells every participant to avoid exactly\nthat, which makes proceeding difficult to reconcile with the advisory even\nthough no rule prohibits the event."
    - text: "A static event with a seated audience is a different exposure profile at the same reading and is constrained less."
      source_doc_id: event-static-versus-strenuous
      source_quote: "| Outdoor festival, seated audience | Prolonged, not strenuous | Partial: applies to vulnerable attendees and to working crew doing physical setup |"
  obligations:
    - text: "Vulnerable attendees outdoors for several hours are advised to wear an N95 mask above 24-hour PSI 200."
      source_doc_id: moh-n95-vulnerable-above-200
      source_quote: "an N95 mask when the 24-hour PSI is above 200"

- role: event
  index: psi_24h
  band: hazardous
  decision: suspend
  reason_codes: [band_hazardous]
  actions:
    - text: "The advisory extends to outdoor activity generally at this band and reaches static events too. An outdoor mass event does not proceed."
      source_doc_id: event-static-versus-strenuous
      source_quote: "At above 300 the advisory extends to outdoor activity generally and reaches\nstatic events too."
  obligations:
    - text: "Crew and volunteers doing setup are workers; susceptible employees are to avoid outdoor work entirely at this band."
      source_doc_id: mom-outdoor-work-hazardous
      source_quote: "| Susceptible employees | Avoid outdoor work |"
